<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacCompanion Spotify OAuth Relay</title>
  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #888;
      background-image:
        linear-gradient(45deg, #000 25%, transparent 25%),
        linear-gradient(-45deg, #000 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #000 75%),
        linear-gradient(-45deg, transparent 75%, #000 75%);
      background-size: 4px 4px;
      background-position: 0 0, 0 2px, 2px -2px, -2px 0;
      font-family: "Chicago", "Geneva", "Monaco", "Courier New", monospace;
      color: #000;
      padding: 20px;
    }
    .mac-dialog {
      background: #fff;
      border: 2px solid #000;
      box-shadow: 4px 4px 0px #000;
      padding: 4px;
      width: 100%;
      max-width: 480px;
    }
    .mac-dialog-inner {
      border: 3px solid #000;
      padding: 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    h1 {
      font-size: 16px;
      margin: 0;
    }
    p {
      font-size: 13px;
      line-height: 1.5;
      margin: 0;
    }
    .code-box {
      width: 100%;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 11px;
      padding: 8px;
      border: 2px solid #000;
      background: #f4f4f4;
      word-break: break-all;
      user-select: all;
    }
    .mac-btn {
      display: inline-block;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      color: #000;
      background: #fff;
      border: 2px solid #000;
      border-radius: 6px;
      padding: 6px 16px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 0 0 1px #fff, 0 0 0 4px #000;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="mac-dialog">
    <div class="mac-dialog-inner">
      <h1 id="title">Returning to MacCompanion...</h1>
      <p id="message">Redirecting your browser back to your local MacCompanion server.</p>
      <a id="manual-return-btn" href="#" class="mac-btn hidden">Return to MacCompanion</a>
      <div id="fallback-box" class="hidden" style="width:100%; display:flex; flex-direction:column; gap:8px;">
        <p>Or copy this authorization code into your MacCompanion server:</p>
        <div id="code-display" class="code-box"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code') || '';
      const state = params.get('state') || '';
      const error = params.get('error') || '';

      let targetOrigin = '';
      if (state.includes('.')) {
        try {
          const parts = state.split('.');
          const decoded = atob(parts[1].replace(/-/g, '+').replace(/_/g, '/'));
          if (decoded.startsWith('http://') || decoded.startsWith('https://')) {
            targetOrigin = decoded;
          }
        } catch (e) {}
      }

      if (code) {
        document.getElementById('code-display').textContent = code;
        document.getElementById('fallback-box').classList.remove('hidden');
      }

      if (targetOrigin) {
        const callbackUrl = `${targetOrigin.replace(/\/$/, '')}/api/spotify/callback?${params.toString()}`;
        const btn = document.getElementById('manual-return-btn');
        btn.href = callbackUrl;
        btn.classList.remove('hidden');
        window.location.replace(callbackUrl);
      } else if (error) {
        document.getElementById('title').textContent = 'Spotify Authorization Failed';
        document.getElementById('message').textContent = `Error: ${error}`;
      } else {
        document.getElementById('title').textContent = 'Spotify Authorization Code';
        document.getElementById('message').textContent = 'Copy the code below into your MacCompanion UI:';
      }
    })();
  </script>
</body>
</html>
