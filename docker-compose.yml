services:
  maccompanion:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    image: maccompanion:latest
    container_name: maccompanion
    restart: unless-stopped
    ports:
      - "6800:6800/tcp"
      - "6801:6801/udp"
      - "6802:6802/tcp"
      - "6803:6803/tcp"
    environment:
      - PORT=6800
      - UDP_DISCOVERY_PORT=6801
      - AUDIO_TCP_PORT=6802
      - DATA_DIR=/app/data
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-https://aeroform-se.github.io/MacCompanion/callback.html}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data
