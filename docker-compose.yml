services:
  maccompanion:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: maccompanion
    restart: unless-stopped
    ports:
      - "6800:6800/tcp"
      - "6801:6801/udp"
    environment:
      - PORT=6800
      - UDP_DISCOVERY_PORT=6801
      - DATA_DIR=/app/data
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-https://aeroform-se.github.io/spotify68k/callback.html}
    volumes:
      - ./data:/app/data
