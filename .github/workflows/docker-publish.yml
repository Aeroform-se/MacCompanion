name: Publish MacCompanion Docker Image

# Only triggers when manually launched by the user from GitHub Actions UI ("Run workflow").
# Never runs automatically on git push or commit.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Docker tag to publish (leave empty to use version from middleware/src/version.js)'
        required: false
        default: ''
      push_latest:
        description: 'Also tag and push as latest'
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Docker Image Tags
        id: meta
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            VERSION_TAG="${{ inputs.tag_name }}"
          else
            VERSION_TAG=$(node -e 'console.log(require("./middleware/src/version.js").SERVER_VERSION_SLUG)')
          fi
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO_OWNER}/maccompanion" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native ${{ matrix.arch }} image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./middleware
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export image digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          echo "Digest: $digest"
          test -n "$digest"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          IMAGES=""
          for f in *; do
            IMAGES="$IMAGES ${{ needs.prepare.outputs.image }}@sha256:$f"
          done
          TAGS="-t ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            TAGS="$TAGS -t ${{ needs.prepare.outputs.image }}:latest"
          fi
          docker buildx imagetools create $TAGS $IMAGES

      - name: Inspect published multi-arch manifest
        run: docker buildx imagetools inspect "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}"
