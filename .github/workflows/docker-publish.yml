name: Publish MacCompanion Docker Image

# Only triggers when manually launched by the user from GitHub Actions UI ("Run workflow").
# Never runs automatically on git push or commit.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Docker tag to publish (leave empty to use version from middleware/src/version.js)'
        required: false
        default: ''
      push_latest:
        description: 'Also tag and push as latest'
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-architecture build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker Image Tags
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION_TAG=$(node -e 'console.log(require("./middleware/src/version.js").SERVER_VERSION_SLUG)')
          fi
          # Convert repository owner to lowercase for Docker / GHCR compatibility
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/maccompanion"
          echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./middleware
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ github.event.inputs.push_latest && format('{0}:latest', steps.meta.outputs.image) || '' }}
