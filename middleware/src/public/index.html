<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro68k Middleware Status</title>
  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #888;
      background-image:
        linear-gradient(45deg, #000 25%, transparent 25%),
        linear-gradient(-45deg, #000 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #000 75%),
        linear-gradient(-45deg, transparent 75%, #000 75%);
      background-size: 4px 4px;
      background-position: 0 0, 0 2px, 2px -2px, -2px 0;
      font-family: "Chicago", "Geneva", "Monaco", "Courier New", monospace;
      color: #000;
      padding: 20px;
    }

    .mac-dialog {
      background: #fff;
      border: 2px solid #000;
      box-shadow: 4px 4px 0px #000;
      padding: 4px;
      width: 100%;
      max-width: 500px;
    }

    .mac-dialog-inner {
      border: 3px solid #000;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .mac-icon {
      width: 100px;
      height: 128px;
      display: block;
      image-rendering: pixelated;
    }

    .retro-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.5px;
      line-height: 1.4;
      margin: 0;
    }

    .error-code {
      font-family: "Monaco", "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      background: #000;
      color: #fff;
      padding: 3px 10px;
    }

    .retro-status {
      font-size: 13px;
      line-height: 1.5;
      padding: 10px 14px;
      border: 1px solid #000;
      background: #fff;
      width: 100%;
      word-break: break-word;
    }

    .config-panel {
      width: 100%;
      border: 1px solid #000;
      padding: 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafafa;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-group label {
      font-size: 12px;
      font-weight: bold;
    }

    .field-group input {
      font-family: "Monaco", "Courier New", monospace;
      font-size: 12px;
      padding: 6px 8px;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      outline: none;
      width: 100%;
    }

    .field-hint {
      font-size: 11px;
      color: #333;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 4px;
    }

    .mac-btn {
      display: inline-block;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      color: #000;
      background: #fff;
      border: 2px solid #000;
      border-radius: 6px;
      padding: 6px 16px;
      text-decoration: none;
      cursor: pointer;
    }

    .mac-btn.primary {
      box-shadow: 0 0 0 1px #fff, 0 0 0 4px #000;
    }

    .mac-btn:active {
      background: #000;
      color: #fff;
    }

    .subtle-link {
      font-size: 11px;
      color: #000;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
    }

    .meta-footer {
      font-size: 11px;
      border-top: 1px dotted #000;
      padding-top: 12px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #000;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="mac-dialog">
    <div class="mac-dialog-inner">
      <!-- Happy Mac or Sad Mac PNG from ui/src -->
      <img
        id="mac-icon"
        class="mac-icon"
        src="/img/happymac.png"
        width="100"
        height="128"
        alt="Macintosh Status Icon"
      />

      <div id="error-code-badge" class="error-code hidden">0000000F</div>

      <h1 class="retro-title" id="headline">Welcome to Macintosh.</h1>

      <div class="retro-status" id="status-box">
        Checking middleware services...
      </div>

      <!-- Configuration Form (shown when awaiting config or editing settings) -->
      <form id="config-form" class="config-panel hidden" onsubmit="saveConfig(event)">
        <div class="field-group">
          <label for="client-id-input">Spotify Client ID:</label>
          <input
            type="text"
            id="client-id-input"
            placeholder="e.g. 4b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e"
            required
          />
          <span class="field-hint" id="config-source-hint">
            Can also be set via SPOTIFY_CLIENT_ID environment variable.
          </span>
        </div>

        <div class="field-group">
          <label for="redirect-uri-input">Redirect URI (in Spotify Developer Dashboard):</label>
          <input
            type="text"
            id="redirect-uri-input"
            value="http://127.0.0.1:6800/api/spotify/callback"
            required
          />
        </div>

        <div class="btn-row">
          <button type="submit" class="mac-btn primary">Save Configuration</button>
          <button type="button" id="cancel-config-btn" class="mac-btn hidden" onclick="toggleConfigEditor(false)">Cancel</button>
        </div>
      </form>

      <!-- Action Buttons (shown when Client ID is configured & awaiting login or in error state) -->
      <div id="action-area" class="btn-row hidden">
        <a href="/api/spotify/login" class="mac-btn primary" id="login-btn">Connect Spotify</a>
        <button type="button" class="mac-btn" id="edit-config-btn" onclick="toggleConfigEditor(true)">Configure Client ID</button>
        <button type="button" class="mac-btn hidden" id="retry-btn" onclick="retryConnection()">Retry / Clear Error</button>
      </div>

      <!-- Optional Manual Callback Paste (helpful if logging in from another LAN machine) -->
      <div id="manual-callback-toggle" class="hidden">
        <button type="button" class="subtle-link" onclick="toggleManualCallback()">
          Logging in from another device on the LAN? Paste callback URL/code
        </button>
      </div>

      <form id="manual-callback-form" class="config-panel hidden" onsubmit="submitManualCallback(event)">
        <div class="field-group">
          <label for="callback-url-input">Paste Redirected Callback URL or Code:</label>
          <input
            type="text"
            id="callback-url-input"
            placeholder="http://127.0.0.1:6800/api/spotify/callback?code=..."
            required
          />
        </div>
        <div class="btn-row">
          <button type="submit" class="mac-btn primary">Complete Login</button>
        </div>
      </form>

      <div class="meta-footer" id="footer-info">
        <span id="lan-ip">IP: ...</span>
        <span id="footer-right">UDP: 6801</span>
      </div>
    </div>
  </div>

  <script>
    let editingConfig = false;
    let lastKnownConfig = { clientId: '', redirectUri: 'http://127.0.0.1:6800/api/spotify/callback', source: 'none' };

    function setMacIcon(isSad, errorCodeText) {
      const icon = document.getElementById('mac-icon');
      const badge = document.getElementById('error-code-badge');
      const targetSrc = isSad ? '/img/sadmac.png' : '/img/happymac.png';
      if (!icon.src.endsWith(targetSrc)) {
        icon.src = targetSrc;
      }
      if (isSad) {
        badge.textContent = errorCodeText || '0000000F';
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function toggleConfigEditor(show) {
      editingConfig = show;
      const form = document.getElementById('config-form');
      const cancelBtn = document.getElementById('cancel-config-btn');
      if (show) {
        document.getElementById('client-id-input').value = lastKnownConfig.clientId || '';
        document.getElementById('redirect-uri-input').value =
          lastKnownConfig.redirectUri || 'http://127.0.0.1:6800/api/spotify/callback';
        form.classList.remove('hidden');
        cancelBtn.classList.toggle('hidden', !lastKnownConfig.clientId);
      } else {
        form.classList.add('hidden');
      }
    }

    function toggleManualCallback() {
      const form = document.getElementById('manual-callback-form');
      form.classList.toggle('hidden');
    }

    async function saveConfig(e) {
      e.preventDefault();
      const clientId = document.getElementById('client-id-input').value.trim();
      const redirectUri = document.getElementById('redirect-uri-input').value.trim();

      try {
        const res = await fetch('/api/spotify/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, redirectUri }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Failed to save configuration');
        }
        editingConfig = false;
        await pollStatus();
      } catch (err) {
        setMacIcon(true, 'CFG_ERR');
        document.getElementById('status-box').classList.remove('hidden');
        document.getElementById('status-box').textContent = err.message;
      }
    }

    async function submitManualCallback(e) {
      e.preventDefault();
      const callbackInput = document.getElementById('callback-url-input').value.trim();
      try {
        const res = await fetch('/api/spotify/callback-manual', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ callbackInput }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Callback exchange failed');
        }
        document.getElementById('manual-callback-form').classList.add('hidden');
        document.getElementById('callback-url-input').value = '';
        await pollStatus();
      } catch (err) {
        await pollStatus();
      }
    }

    async function retryConnection() {
      try {
        await fetch('/api/spotify/clear-error', { method: 'POST' });
        await pollStatus();
      } catch (err) {
        await pollStatus();
      }
    }

    function renderUI(data) {
      const spotify = data.modules && data.modules.spotify;
      const statusBox = document.getElementById('status-box');
      const headline = document.getElementById('headline');
      const actionArea = document.getElementById('action-area');
      const configForm = document.getElementById('config-form');
      const loginBtn = document.getElementById('login-btn');
      const retryBtn = document.getElementById('retry-btn');
      const manualToggle = document.getElementById('manual-callback-toggle');

      document.getElementById('lan-ip').textContent = `IP: ${data.server.ip}:${data.server.httpPort}`;
      document.getElementById('footer-right').textContent = `UDP: ${data.server.udpPort}`;

      if (!spotify) return;

      if (spotify.config) {
        lastKnownConfig = spotify.config;
        const hint = document.getElementById('config-source-hint');
        if (spotify.config.source === 'env') {
          hint.textContent = 'Currently supplied via SPOTIFY_CLIENT_ID environment variable.';
        } else {
          hint.textContent = 'Saved in persistent ./data/spotify.json (or set via SPOTIFY_CLIENT_ID env var).';
        }
      }

      // 1. Error State -> Show Sad Mac
      if (spotify.error || spotify.state === 'ERROR') {
        setMacIcon(true, spotify.errorCode || 'SPOTIFY_ERR');
        headline.textContent = 'Spotify Service Error';
        statusBox.classList.remove('hidden');
        statusBox.textContent = spotify.message || 'An unexpected Spotify error occurred.';
        actionArea.classList.remove('hidden');
        loginBtn.classList.toggle('hidden', !lastKnownConfig.clientId);
        retryBtn.classList.remove('hidden');
        manualToggle.classList.add('hidden');
        if (!editingConfig) configForm.classList.add('hidden');
        return;
      }

      // 2. Operational & Logged In -> Simply display Happy Mac & retro bitmap font stating Spotify service is running OK
      if (spotify.ok && spotify.state === 'READY') {
        setMacIcon(false);
        headline.textContent = 'Spotify service is running OK';
        statusBox.classList.add('hidden');
        actionArea.classList.add('hidden');
        configForm.classList.add('hidden');
        manualToggle.classList.add('hidden');
        document.getElementById('manual-callback-form').classList.add('hidden');
        return;
      }

      // 3. Awaiting Client ID Configuration -> Happy Mac + Config Form
      if (spotify.state === 'AWAITING_CONFIG') {
        setMacIcon(false);
        headline.textContent = 'Retro68k Spotify Setup';
        statusBox.classList.remove('hidden');
        statusBox.textContent = spotify.message;
        actionArea.classList.add('hidden');
        manualToggle.classList.add('hidden');
        if (!editingConfig) {
          toggleConfigEditor(true);
        }
        return;
      }

      // 4. Awaiting PKCE Login -> Happy Mac + Connect Button
      setMacIcon(false);
      headline.textContent = 'Retro68k Middleware';
      statusBox.classList.remove('hidden');
      statusBox.textContent = `${spotify.message}`;
      actionArea.classList.remove('hidden');
      loginBtn.classList.remove('hidden');
      retryBtn.classList.add('hidden');
      manualToggle.classList.remove('hidden');
      if (!editingConfig) {
        configForm.classList.add('hidden');
      }
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderUI(data);
      } catch (err) {
        // Middleware unreachable / network offline -> Show Sad Mac
        setMacIcon(true, 'NET_OFFLINE');
        document.getElementById('headline').textContent = 'Middleware Unreachable';
        const statusBox = document.getElementById('status-box');
        statusBox.classList.remove('hidden');
        statusBox.textContent = 'Cannot reach middleware server or network connection lost.';
      }
    }

    pollStatus();
    setInterval(pollStatus, 4000);
  </script>
</body>
</html>
